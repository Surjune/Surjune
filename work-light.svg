ight="24" rx="12" fill="#EEF4FF" stroke="#CCDBF5"/><text x="648.2" y="344.0" font-size="11" fill="#33456B" class="mono" text-anchor="middle">Explainable AI</text><text x="592.0" y="430.0" font-size="12" fill="#2563EB" class="mono" font-weight="600" letter-spacing="1.4">SOURCE ON GITHUB ↗</text></g><g class="panel" style="animation-delay:12.0s"><text x="592.0" y="100.0" font-size="12" fill="#5E6F92" class="mono" letter-spacing="1.4">04 / 05</text><text x="592.0" y="140.0" font-size="28" fill="#0B1B3A" class="sans" font-weight="700">Face-Detector</text><text x="592.0" y="176.0" font-size="14" fill="#33456B" class="sans">Detects and encodes a face, finds</text><text x="592.0" y="198.0" font-size="14" fill="#33456B" class="sans">a genuine matching post on social</text><text x="592.0" y="220.0" font-size="14" fill="#33456B" class="sans">media, and anchors it on Ethereum</text><text x="592.0" y="242.0" font-size="14" fill="#33456B" class="sans">Sepolia as tamper-evident proof</text><text x="592.0" y="264.0" font-size="14" fill="#33456B" class="sans">anyone can re-verify.</text><rect x="592.0" y="296.0" width="59.6" height="24" rx="12" fill="#EEF4FF" stroke="#CCDBF5"/><text x="621.8" y="312.0" font-size="11" fill="#33456B" class="mono" text-anchor="middle">Python</text><rect x="659.6" y="296.0" width="72.8" height="24" rx="12" fill="#EEF4FF" stroke="#CCDBF5"/><text x="696.0" y="312.0" font-size="11" fill="#33456B" class="mono" text-anchor="middle">Solidity</text><rect x="740.4" y="296.0" width="72.8" height="24" rx="12" fill="#EEF4FF" stroke="#CCDBF5"/><text x="776.8" y="312.0" font-size="11" fill="#33456B" class="mono" text-anchor="middle">Ethereum</text><rect x="592.0" y="328.0" width="119.0" height="24" rx="12" fill="#EEF4FF" stroke="#CCDBF5"/><text x="651.5" y="344.0" font-size="11" fill="#33456B" class="mono" text-anchor="middle">Computer Vision</text><text x="592.0" y="430.0" font-size="12" fill="#2563EB" class="mono" font-weight="600" letter-spacing="1.4">SOURCE ON 